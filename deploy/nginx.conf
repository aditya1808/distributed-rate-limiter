upstream ratelimiter {
    # Round-robin per request: nginx speaks HTTP/1.0 to upstreams by default,
    # so every proxied request can land on a different instance.
    server app1:8080 max_fails=2 fail_timeout=5s;
    server app2:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    client_max_body_size 64k;

    location / {
        proxy_pass http://ratelimiter;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }
}
