# Production-like local stack: two instances sharing one Redis behind an
# nginx round-robin load balancer on http://localhost:8080.
#
#   ADMIN_TOKEN=$(openssl rand -hex 32) docker compose up --build -d
x-app: &app
  build: .
  image: distributed-rate-limiter:local
  environment: &app-env
    REDIS_URL: redis://redis:6379/0
    ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token-change-me}
    LOG_LEVEL: info
    SHUTDOWN_DRAIN_DELAY: 2s
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    # Rules live in Redis, so it must persist across restarts.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

volumes:
  redis-data:
